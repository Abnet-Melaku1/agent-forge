[project]
name = "agentforge-api"
version = "0.0.0"
description = "FastAPI gateway: workflows, runs, and the execution event stream."
requires-python = ">=3.12"
dependencies = [
    "agentforge-db",
    "agentforge-engine",
    "agentforge-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
agentforge-db = { workspace = true }
agentforge-engine = { workspace = true }
agentforge-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
