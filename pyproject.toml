[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pre-commit>=3.8",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs", "services"]
extend-exclude = ["**/migrations/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
exclude = ["migrations/"]
mypy_path = "libs/schemas/src:libs/engine/src:libs/db/src:services/api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
