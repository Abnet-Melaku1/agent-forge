[project]
name = "agentforge-providers"
version = "0.0.0"
description = "Unified LLM provider adapters for OpenAI and Anthropic"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.18",
    "agentforge-schemas",
]

[tool.uv.sources]
agentforge-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]
