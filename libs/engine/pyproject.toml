[project]
name = "agentforge-engine"
version = "0.0.0"
description = "DAG compile + schedule + node registry (pure, framework-agnostic)."
requires-python = ">=3.12"
dependencies = ["agentforge-schemas"]

[tool.uv.sources]
agentforge-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]
