[project]
name = "agentforge-schemas"
version = "0.0.0"
description = "AgentForge domain models and node config schemas (source of truth)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge"]
