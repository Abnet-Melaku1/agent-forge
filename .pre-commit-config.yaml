repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy libs services
        language: system
        types: [python]
        pass_filenames: false
